obs:
  host: "127.0.0.1"
  port: 4455
  # password read from OS keyring, never from this file
twitch:
  channel: "your_channel"
  # overridden by TWITCH_CHANNEL; token comes from .env or the OS keyring
asr:
  provider: parakeet
  model: "nvidia/parakeet-unified-en-0.6b"
  device: cuda # cpu is not a supported configuration
  streaming_latency_ms: 160
  sample_rate: 16000
  min_free_vram_mb: 2500 # preflight gate, see R-ASR-04
reasoning:
  provider: auto
  endpoint: ""
  # attribute uses the provider's native schema field; system_prompt embeds the
  # same schema in the system/developer instruction as a compatibility fallback.
  structured_output_mode: attribute # attribute | system_prompt
  model: "deepseek-v4-flash-free"
  fallback_models:
    - "longcat-2.0-free"
    - "ling-3.0-tiny-free"
    - "mimo-v2.5-free"
    - "laguna-s-2.1-free"
    - "nemotron-3-ultra-free"
  timeout_s: 45.0
  max_attempts: 3
pipeline:
  chat_batch_max_representative_texts: 50
  chat_batch_max_wait_s: 120
  chat_filter_min_recognized_words: 3
  rolling_window_s: 90
  decision_ttl_s: 20
autonomy:
  startup_level: OBSERVE
environment: development
