[project]
name = "codirector"
version = "0.1.0"
description = "AI Stream Co-Director — deterministic-policy production assistant POC"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "keyring>=25.0",
    "obsws-python>=1.7",
    "twitchio>=2.10",
    "sounddevice>=0.4.6",
    "webrtcvad>=2.0.10",
    "numpy>=1.26",
    "aiohttp>=3.9",
    "keyboard>=0.13.5",
]

[project.optional-dependencies]
asr = [
    "nemo_toolkit[asr]>=1.23",
    "torch>=2.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["codirector*"]
